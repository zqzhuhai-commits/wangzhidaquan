<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch 网址导航</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#172b4d;background:#e7ecf4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}.shell{width:min(1280px,100%);background:#f2f5fa;border-radius:28px;padding:40px 56px 25px;box-shadow:0 25px 80px #263c5d15}.head{display:flex;align-items:center;gap:16px;margin-bottom:45px}.logo{width:50px;height:50px;display:grid;place-items:center;background:#2474ef;color:white;font-size:38px;font-weight:600;border-radius:14px}h1{font-size:34px;line-height:1.1;margin:0 0 9px;letter-spacing:1px}.eyebrow{font-size:13px;color:#78869a;letter-spacing:2px}.head-actions{margin-left:auto;text-align:right;display:grid;gap:12px;justify-items:end}.utility{font-size:15px;color:#18884c;background:#e0f3e7;padding:10px 18px;border-radius:12px;text-decoration:none}.pill{margin-left:auto;font-size:14px;color:#39638f;background:#e1eaf7;border-radius:20px;padding:9px 18px}form{display:flex;gap:16px;margin-bottom:24px}input,button,a{-webkit-tap-highlight-color:transparent}input{min-width:0;flex:1;font:inherit;font-size:23px;border:0;padding:20px 23px;background:white;border-radius:14px;color:#172b4d}input::placeholder{color:#8794a7}button{font:inherit;cursor:pointer}button.go{padding:0 35px;font-size:23px;color:white;background:#2474ef;border:0;border-radius:14px}input:focus,button:focus-visible,a:focus-visible{outline:4px solid #2e83f5;outline-offset:4px}h2{font-size:22px;font-weight:600;margin:0}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 18px}.section-head span{font-size:15px;color:#78869a}.site-scroller{max-height:340px;overflow-y:auto;overscroll-behavior:contain;padding:5px;margin:-5px;scrollbar-color:#89aee0 #e0e6ef;scrollbar-width:thin}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.site{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:white;padding:17px 16px;border-radius:14px;transition:transform .12s,box-shadow .12s;min-width:0}.site:hover{transform:translateY(-3px);box-shadow:0 8px 18px #263c5d12}.badge{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:white;font-size:25px;flex-shrink:0}.name{font-size:20px;font-weight:550;white-space:nowrap}.tag{font-size:14px;color:#8897ac;margin-top:6px}.status{font-size:15px;color:#576c89;min-height:23px;margin:24px 0 20px;overflow-wrap:anywhere}.footer{border-top:1px solid #dce3ee;padding-top:20px;color:#60728b;display:flex;justify-content:space-between;font-size:14px}.footer b{font-size:13px;border:1px solid #9baabe;border-radius:50%;display:inline-grid;place-items:center;width:22px;height:22px;margin:0 5px 0 16px}.footer b:first-child{margin-left:0}.preview{font-size:12px;color:#8a98ac;margin:15px 0 0;text-align:center}a,button{touch-action:manipulation}@media(max-width:860px){body{padding:15px}.shell{padding:30px}.grid{grid-template-columns:repeat(3,1fr)}.section-head span{display:none}.footer{font-size:12px}.name{font-size:18px}.pill{font-size:12px}button.go{padding:0 22px}}@media(max-width:580px){.shell{padding:24px 18px}.head{flex-wrap:wrap}.head-actions{width:100%;display:flex;justify-content:flex-end}.utility{font-size:14px}.site-scroller{max-height:400px}h1{font-size:26px}.pill{display:none}.head{margin-bottom:30px}input{font-size:17px;padding:18px 12px}button.go{font-size:17px;padding:0 14px}form{gap:10px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.site{padding:14px 10px;gap:10px}.badge{width:38px;height:38px;font-size:21px}.footer{line-height:2;gap:12px}.footer b{margin-left:8px}}
.custom-actions{display:flex;gap:20px;align-items:center;margin-top:20px}.custom-actions button,.dialog-actions button,.tile-actions button{border:0;border-radius:10px;padding:10px 18px;color:#fff;background:#2474ef}.custom-actions span{color:#8794a7;font-size:14px}.custom-wrap{min-width:0;background:#fff;border-radius:14px}.custom-wrap .site{padding-bottom:8px}.tile-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 12px 12px}.tile-actions button{padding:5px 10px;background:#e3e9f3;color:#526882;font-size:13px}dialog{border:0;border-radius:20px;padding:28px;width:min(540px,90vw);color:#172b4d;box-shadow:0 20px 80px #172b4d40}dialog::backdrop{background:#172b4d80}#bookmark-form{display:grid;gap:18px;margin:0}#bookmark-form label{display:grid;gap:8px;font-size:15px}#bookmark-form input{width:100%;border:1px solid #dce3ee;background:#f2f5fa;font-size:18px;padding:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:12px}#bookmark-error{color:#c83e51;font-size:14px;margin:0}#bookmark-cancel{background:#e3e9f3;color:#526882}@media(max-width:580px){.custom-actions{flex-wrap:wrap;gap:10px}.custom-actions span{font-size:12px}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div class="logo" aria-hidden="true">N</div><div><h1>网址导航</h1><div class="eyebrow">SWITCH WEB NAV</div></div><div class="head-actions"><div class="pill">常用站点 · 17</div><a class="utility" href="https://filehelper.weixin.qq.com/">微信文件传输助手 ↗</a></div></header>
<form id="form"><input id="url" aria-label="输入网址" placeholder="输入网址，例如 baidu.com" type="text" autocomplete="url" inputmode="url" spellcheck="false" maxlength="2038"><button class="go" type="submit">打开网页</button></form>
<div class="section-head"><h2>常用站点</h2><span>上下滚动 · 选择后打开</span></div>
<div class="site-scroller" tabindex="-1"><nav class="grid" id="sites" aria-label="常用站点与在线小游戏"></nav></div>
<div class="custom-actions"><button id="add-bookmark" type="button">＋ 添加自定义网址</button><span>自定义网址保存在本机，重启后保留</span></div>
<dialog id="bookmark-dialog"><form id="bookmark-form"><h2 id="dialog-title">添加自定义网址</h2><label>名称<input id="bookmark-name" maxlength="32" required placeholder="例如：我的网站"></label><label>网址<input id="bookmark-url" maxlength="500" required placeholder="例如：example.com" inputmode="url"></label><p id="bookmark-error" role="alert"></p><div class="dialog-actions"><button id="bookmark-cancel" type="button">取消</button><button type="submit">保存网址</button></div></form></dialog>
<p class="status" id="status" role="status">输入网址，或选择下方站点</p>
<footer class="footer"><div>方向键 选择 · 上下滚动 <b>A</b>确认 <b>X</b>输入网址 <b>B</b>返回输入框</div><span>SWITCH WEB NAV</span></footer>
<p class="preview">桌面界面预览 · 链接在当前浏览器打开；Switch 原生版使用系统网页组件</p>
</main>
<script>
'use strict';
const sites=[
['百度','https://www.baidu.com/','搜索','#367bf5'],['必应','https://cn.bing.com/','搜索','#13a9a0'],['哔哩哔哩','https://www.bilibili.com/','视频','#ec78a0'],['腾讯视频','https://v.qq.com/','视频','#19ac82'],['爱奇艺','https://www.iqiyi.com/','视频','#55a82e'],['优酷','https://www.youku.com/','视频','#2786dc'],['知乎','https://www.zhihu.com/','社区','#3479df'],['微博','https://weibo.com/','社区','#e45b45'],['央视网','https://www.cctv.com/','资讯','#c84d59'],['人民网','https://www.people.com.cn/','资讯','#bf5444'],['京东','https://www.jd.com/','购物','#e44c55'],['淘宝','https://www.taobao.com/','购物','#f28b32'],['4399小游戏','https://www.4399.com/','小游戏','#ef8c31'],['4399在线玩','https://h.4399.com/','H5小游戏','#22a67b'],['7k7k小游戏','https://m.7k7k.com/','小游戏','#6f70df'],['17yy小游戏','https://h.17yy.com/','H5小游戏','#e46c8c'],['腾讯START','https://start.qq.com/m/cloudgame/index.html','云游戏','#3777e8'],['网易云游戏','https://cg.163.com/','云游戏','#d34f51'],['腾讯先锋','https://gamer.qq.com/','云游戏','#477dc0'],['咪咕快游','https://www.migufun.com/','云游戏','#17a986']];
const grid=document.querySelector('#sites'),input=document.querySelector('#url'),status=document.querySelector('#status');
const storageKey='switch-webnav-bookmarks-v1',dialog=document.querySelector('#bookmark-dialog');
let custom=[],editing=-1;
function normalize(raw){const s=raw.trim();if(!s||s.length>=2039||/[\s\x00-\x20\x7f\\]/.test(s)||s.startsWith('//'))throw Error('请输入有效的网址');let value=s;if(!/^https?:\/\//i.test(s)){if(s.includes('://'))throw Error('只支持 HTTP / HTTPS 网址');value='https://'+s;}const u=new URL(value);if(!['http:','https:'].includes(u.protocol)||u.username||u.password||!u.hostname||u.hostname.includes(':'))throw Error('请输入域名或 IPv4 地址');const authority=value.replace(/^https?:\/\//i,'').split(/[/?#]/)[0];if(!/^[a-zA-Z0-9.\-]+(?::[0-9]+)?$/.test(authority))throw Error('域名请使用英文或 Punycode');const [host,port]=authority.split(':');if(host.length>253||host.split('.').some(x=>!x||x.length>63||x.startsWith('-')||x.endsWith('-'))||(port!==undefined&&(!Number(port)||Number(port)>65535)))throw Error('域名或端口格式有误');return value;}

function cleanName(name){const value=String(name).trim();if(!value||[...value].length>32||/[\x00-\x1f\x7f]/.test(value))throw Error('请输入1至32字的名称');return value;}
try{const raw=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(raw))for(const item of raw){try{const name=cleanName(item.name),url=normalize(item.url);if(!custom.some(x=>x.url===url))custom.push({name,url});}catch{}}}catch{status.textContent='本机数据读取失败；浏览器可能禁用了本地存储';}
function persist(next){try{localStorage.setItem(storageKey,JSON.stringify(next));custom=next;return true;}catch{status.textContent='保存失败：浏览器本地存储不可用';return false;}}
function label(name){const h=document.createElement('h2');h.textContent=name;h.style.cssText='grid-column:1/-1;font-size:18px;margin:4px 0 -2px';grid.append(h);}
function tile(name,url,tag,color){const a=document.createElement('a');a.className='site';a.href=url;const badge=document.createElement('span');badge.className='badge';badge.style.background=color;badge.textContent=[...name][0];badge.setAttribute('aria-hidden','true');const copy=document.createElement('span'),title=document.createElement('div'),sub=document.createElement('div');title.className='name';title.textContent=name;sub.className='tag';sub.textContent=tag;copy.append(title,sub);a.append(badge,copy);a.addEventListener('click',()=>status.textContent='正在打开 '+name+'…');return a;}
function render(){grid.replaceChildren();for(const [i,[name,url,tag,color]]of sites.entries()){if(i===12)label('在线小游戏');if(i===16)label('网页版云游戏');grid.append(tile(name,url,tag,color));}if(custom.length)label('我的网址');custom.forEach((item,i)=>{const wrap=document.createElement('div');wrap.className='custom-wrap';wrap.append(tile(item.name,item.url,'自定义','#6573d5'));const actions=document.createElement('div');actions.className='tile-actions';for(const kind of ['编辑','删除']){const b=document.createElement('button');b.type='button';b.textContent=kind;b.setAttribute('aria-label',kind+item.name);b.addEventListener('click',()=>{if(kind==='编辑')openEditor(i);else if(confirm('删除自定义网址“'+item.name+'”？')){if(persist(custom.filter((_,n)=>n!==i))){render();status.textContent='自定义网址已删除';}}});actions.append(b);}wrap.append(actions);grid.append(wrap);});document.querySelector('.pill').textContent='站点入口 · '+(sites.length+1+custom.length);}
function openEditor(index=-1){editing=index;document.querySelector('#dialog-title').textContent=index<0?'添加自定义网址':'编辑自定义网址';document.querySelector('#bookmark-name').value=index<0?'':custom[index].name;document.querySelector('#bookmark-url').value=index<0?input.value:custom[index].url;document.querySelector('#bookmark-error').textContent='';dialog.showModal();document.querySelector('#bookmark-name').focus();}
document.querySelector('#add-bookmark').addEventListener('click',()=>openEditor());
document.querySelector('#bookmark-cancel').addEventListener('click',()=>dialog.close());
document.querySelector('#bookmark-form').addEventListener('submit',e=>{e.preventDefault();try{const name=cleanName(document.querySelector('#bookmark-name').value),url=normalize(document.querySelector('#bookmark-url').value);if(custom.some((x,i)=>i!==editing&&x.url===url))throw Error('这个网址已经添加过了');const next=custom.map(x=>({...x}));if(editing<0)next.push({name,url});else next[editing]={name,url};if(!persist(next))throw Error('本地存储不可用，网址未保存');render();dialog.close();status.textContent='已保存自定义网址，重启后仍会保留';if(editing<0)grid.querySelectorAll('.site')[sites.length+custom.length-1].focus();}catch(err){document.querySelector('#bookmark-error').textContent=err.message;}});
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();try{const target=normalize(input.value);status.textContent='正在打开 '+target+'…';location.assign(target);}catch(err){status.textContent=err.message;input.focus();}});
document.addEventListener('keydown',e=>{if(dialog.open||document.activeElement.tagName==='INPUT')return;if(e.key==='Escape'||e.key.toLowerCase()==='x'||e.key.toLowerCase()==='b'){e.preventDefault();input.focus();return;}if(e.key.toLowerCase()==='a'){e.preventDefault();document.activeElement.click();return;}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const current=document.activeElement.getBoundingClientRect(),axis=e.key==='ArrowLeft'||e.key==='ArrowRight'?'x':'y',sign=e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1;let best=null,score=Infinity;for(const el of document.querySelectorAll('main input,main button,main a')){if(el.closest('dialog')||el===document.activeElement)continue;const r=el.getBoundingClientRect(),dx=(r.left+r.width/2)-(current.left+current.width/2),dy=(r.top+r.height/2)-(current.top+current.height/2),along=(axis==='x'?dx:dy)*sign,cross=Math.abs(axis==='x'?dy:dx);if(along>5&&along+cross*3<score){score=along+cross*3;best=el;}}if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'});}});
render();
</script>
</body></html>
