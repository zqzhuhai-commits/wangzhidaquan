name: Build Switch NRO
on:
  workflow_dispatch:
  push:
    paths: ['source/**', 'Makefile', 'icon.jpg', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL dependencies
        run: dkp-pacman -Syu --noconfirm --needed switch-dev switch-sdl2 switch-sdl2_ttf
      - name: Build NRO
        run: |
          export PATH="$DEVKITPRO/portlibs/switch/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchWebNav-NRO
          path: SwitchWebNav.nro
          if-no-files-found: error
