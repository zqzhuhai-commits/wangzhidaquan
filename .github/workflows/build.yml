name: Build Switch NRO
on:
  workflow_dispatch:
  push:
    paths: ['source/**', 'Makefile', 'icon.jpg', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      # The official image already contains switch-dev and Switch portlibs.
      - name: Build NRO and prepare NSP inputs without keys
        run: |
          export PATH="$DEVKITPRO/portlibs/switch/bin:$DEVKITPRO/tools/bin:$PATH"
          make -j2
          mkdir -p nsp-input/exefs nsp-input/control
          elf2nso SwitchWebNav.elf nsp-input/exefs/main
          npdmtool packaging/npdm.json nsp-input/exefs/main.npdm
          cp SwitchWebNav.nacp nsp-input/control/control.nacp
          cp icon.jpg nsp-input/icon.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchWebNav-NRO
          path: SwitchWebNav.nro
          if-no-files-found: error
      # Final NSP encryption/packaging stays local; no keyset is needed in CI.
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchWebNav-NSP-input
          path: nsp-input/
          if-no-files-found: error
